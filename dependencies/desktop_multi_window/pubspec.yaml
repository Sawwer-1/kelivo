name: desktop_multi_window
description: A flutter plugin that create and manager multi window in desktop.
# Kelivo fork of 0.3.1:
# - WindowConfiguration extended (size/title/borderless/alwaysOnTop/skipTaskbar/alignBottomRight)
# - window_start_drag / window_close methods for sub-window engines
# - keeps sub-window engines free of window_manager (avoids its global
#   native_window singleton being stolen across engines)
version: 0.3.1-kelivo.1
homepage: https://github.com/MixinNetwork/flutter-plugins/tree/main/packages/desktop_multi_window

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterMultiWindowPlugin
      windows:
        pluginClass: DesktopMultiWindowPlugin
      linux:
        pluginClass: DesktopMultiWindowPlugin
